[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probe-agents"
version = "0.1.0"
description = "Detect, localize, and explain AI-agent failures from production execution traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PROBE contributors" }]
keywords = ["llm", "agents", "observability", "root-cause-analysis", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bench = ["numpy>=1.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
probe = "probe.cli:app"

[project.urls]
Homepage = "https://github.com/ritiksharmax/probe"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires calling Option()/Argument() in parameter defaults; B008
# flags that pattern generically, but here it is the documented idiom.
"src/probe/cli.py" = ["B008"]
